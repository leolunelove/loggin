<!doctype html><meta charset="utf-8"><title>Loggin’ screenshot studio</title><style>body{margin:0;background:#273025;color:#f5ebd1;font:14px Georgia}header{padding:10px;display:flex;gap:12px}button{padding:10px}iframe{border:0;width:100%;height:calc(100vh - 65px)}</style><header><button id="camp">Expanded camp</button><button id="river">River</button><button id="chopping">Chopping</button><button id="download">Save screenshot</button><output>Loading…</output></header><iframe src="/?capture&nopad"></iframe><script type="module">
import {freshState} from '/src/economy.js';import {startingTree} from '/src/world/home-site.js';import {movingChopContact} from '/src/mechanics.js';
let lab,mode='camp';const f=document.querySelector('iframe'),out=document.querySelector('output');const wait=setInterval(()=>{lab=f.contentWindow.lab;if(!lab?.ready)return;clearInterval(wait);lab.game.save=()=>{};lab.game.before=()=>{};lab.game.update=()=>{};render();},100);
function render(){if(!lab?.ready)return;const g=lab.game,h=g.home.group.position;g.state={...freshState(),shed:40,sawmill:40,porch:12,lodge:24,planks:12,wood:100,axe:1};g.renderHud();g.started=true;g.swing=null;
 for(const id of ['intro','hud','controls','action','mouse-capture','target','home-marker','project-status','aim-status'])f.contentDocument.getElementById(id).hidden=true;
 if(mode==='camp'){lab.teleport(g.home.dropoff.x,g.home.dropoff.z+.5,h.x,h.z);lab.view([h.x+7,h.y+9,h.z+8],[h.x+1.8,h.y+1,h.z-1.5]);}
 if(mode==='river'){lab.teleport(h.x,h.z+6,h.x,h.z);lab.view([h.x+25,h.y+10,h.z+17],[h.x+20,h.y,h.z-16]);}
 if(mode==='chopping'){const t=startingTree(lab.forest.trees),x=t.x,z=t.z+t.r+1.12;lab.teleport(x,z,t.x,t.z);const y=lab.heightAt(x,z);lab.view([x+3.3,y+2.1,z+.4],[t.x,y+1.3,t.z+.3]);g.swing={t,variant:1,age:.5,duration:1,poseProgress:.5,contact:movingChopContact(t,lab.player.feet,lab.player.visualY)};lab.forest.carveTree(t,g.swing.contact,0,1,.65);}
 g.shade.refresh();lab.step(1/60,4);out.textContent=mode+' · actual game render';}
for(const name of ['camp','river','chopping'])document.getElementById(name).onclick=()=>{mode=name;render();};
document.getElementById('download').onclick=()=>{render();lab.renderer.domElement.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=mode+'.webp';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);},'image/webp',.88);};
</script>
