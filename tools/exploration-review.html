<!doctype html><meta charset="utf-8"><title>Loggin’ campfire review</title><style>body{margin:0;background:#283125;color:#f5ebd1;font:13px Georgia}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:9px}iframe{border:0;width:100%;height:calc(100vh - 65px)}</style><header><button id="trailview">Trail view</button><button id="orchard">Orchard</button><button id="riverstop">Riverwatch</button><button id="logging">Pine Hollow</button><button id="supplies">Supply camp</button><button id="rain">Rain</button><button id="mist">Misty dawn</button><button id="clear">Clear skies</button><button id="bench">Approach bench</button><button id="sit">Sit / stand</button><button id="settle">Ease camera</button><button id="hearth">Approach hearth</button><button id="buildfire">Add logs at hearth</button><button id="animate">Play fire & sound</button><button id="day">Morning</button><button id="dusk">Evening</button><button id="night">Midnight</button><button id="sleepstep">Finish sleep</button><button id="door">Start at doorway</button><button id="in">Walk inside</button><button id="out">Walk outside</button><button id="expand">Complete camp upgrades</button><button id="rear">Walk into rear room</button><button id="ledger">Camp ledger</button><button id="capture">Save interior screenshot</button><output>Loading…</output></header><iframe src="/?capture&nopad"></iframe><script type="module">
import {freshState} from '/src/economy.js';import {DOOR} from '/src/world/shack-layout.js';let lab;const f=document.querySelector('iframe'),out=document.querySelector('output');const wait=setInterval(()=>{lab=f.contentWindow.lab;if(!lab?.ready)return;clearInterval(wait);lab.game.save=()=>{};setup();},100);
const neutral=()=>({move:{x:0,y:0},look:{x:0,y:0},zoom:0,walk:true,strafe:true,device:'pad'});
function report(){const g=lab.game,p=lab.player.feet,h=g.home.group.position;out.textContent=`${g.home.contains(p,g.state)?'Inside':'Outside'} · x ${(p.x-h.x).toFixed(2)}, z ${(p.z-h.z).toFixed(2)}, floor ${(p.y-h.y).toFixed(2)}`;}
function setup(){const g=lab.game,h=g.home.group.position;g.state={...freshState(),wood:24,hardwood:8,planks:4,carried:8};g.started=true;g.renderHud();for(const id of ['intro','mouse-capture'])f.contentDocument.getElementById(id).hidden=true;f.contentDocument.getElementById('hud').hidden=false;lab.input.override=neutral;lab.teleport(h.x+DOOR.x,h.z+3,h.x+DOOR.x,h.z);lab.step(1/60,15);report();}
function walk(direction,frames){lab.input.override=()=>({...neutral(),move:{x:0,y:direction}});lab.step(1/60,frames);lab.input.override=neutral;lab.step(1/60,20);report();}
for(const [id,hour]of [['day',9],['dusk',18.5],['night',23]])document.getElementById(id).onclick=()=>{lab.game.state.hour=hour;lab.step(1/60,2);report();};document.getElementById('sleepstep').onclick=()=>{lab.step(1/60,140);report();};
for(const [id,weather]of [['rain',{rain:1,mist:0,overcast:.85,label:'Rain'}],['mist',{rain:0,mist:1,overcast:.35,label:'Morning mist'}],['clear',{rain:0,mist:0,overcast:0,label:'Clear'}]])document.getElementById(id).onclick=()=>{lab.game.weatherOverride=weather;if(id==='mist')lab.game.state.hour=6.8;lab.step(1/60,2);report();};
for(const [i,id]of ['orchard','riverstop','logging'].entries())document.getElementById(id).onclick=()=>{const h=lab.game.exploration.sites[i].group.position;lab.view([h.x+7,h.y+5,h.z+10],[h.x,h.y+1,h.z]);lab.teleport(h.x-.48,h.z+3,h.x,h.z);lab.step(1/60,5);report();};document.getElementById('supplies').onclick=()=>{Object.assign(lab.game.state,{wood:200,planks:32});lab.game.renderHud();lab.step(1/60,2);};
document.getElementById('trailview').onclick=()=>{const r=lab.game.exploration.routes[0],p=r.points[Math.floor(r.points.length*.6)],y=lab.heightAt(p.x,p.z);lab.teleport(p.x,p.z,p.x,p.z-3);lab.view([p.x+6,y+7,p.z+8],[p.x,y,p.z]);lab.step(1/60,15);out.textContent=lab.game.exploration.onTrail(lab.player.feet,lab.game.state)?'Trail travel +25%':'Off trail';};
document.getElementById('bench').onclick=()=>{Object.assign(lab.game.state,{fire:12,hour:23});lab.game.renderHud();const b=lab.game.home.bench.position,p=lab.game.home.fire.position;lab.view(null);lab.teleport(b.x,b.z-.95,p.x,p.z);lab.step(1/60,15);report();};
document.getElementById('sit').onclick=()=>{lab.input.override=()=>({...neutral(),interactPressed:true});lab.step(1/60,1);lab.input.override=neutral;lab.step(1/60,1);report();};document.getElementById('settle').onclick=()=>{lab.step(1/60,90);report();};
document.getElementById('hearth').onclick=()=>{const p=lab.game.home.fire.position,h=lab.game.home.group.position;lab.teleport(p.x,p.z+2,p.x,p.z);lab.view([p.x-4,p.y+4.4,p.z+7],[h.x-1,h.y+.9,h.z+1.5]);lab.step(1/60,3);report();};
document.getElementById('buildfire').onclick=()=>{lab.input.override=()=>({...neutral(),interactPressed:true});lab.step(1/60,1);lab.input.override=neutral;lab.step(1/60,1);report();};
let playing=false,last;document.getElementById('animate').onclick=()=>{playing=!playing;lab.game.audio.start(true);last=performance.now();function tick(t){if(!playing)return;lab.step(Math.min(.033,(t-last)/1000),1);last=t;requestAnimationFrame(tick);}if(playing)requestAnimationFrame(tick);};
document.getElementById('door').onclick=setup;document.getElementById('in').onclick=()=>walk(1,90);document.getElementById('out').onclick=()=>walk(-1,110);document.getElementById('rear').onclick=()=>walk(1,100);
document.getElementById('expand').onclick=()=>{Object.assign(lab.game.state,{shed:40,sawmill:40,porch:12,lodge:24,axe:3,wood:80,hardwood:24,planks:12,felled:37,total:280});lab.game.renderHud();lab.game.shade.refresh();lab.step(1/60,5);report();};document.getElementById('ledger').onclick=()=>lab.game.open('ledger');
document.getElementById('capture').onclick=()=>{lab.step(1/60,2);lab.renderer.domElement.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='weather.webp';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);},'image/webp',.88);};
</script>
