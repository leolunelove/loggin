<!doctype html><meta charset="utf-8"><title>Loggin’ feature review</title>
<style>body{margin:0;background:#252a20;color:#f5ebd1;font:14px Arial}header{padding:8px;display:flex;flex-wrap:wrap;gap:7px}button{font:inherit;background:#e9d6a9;border:0;padding:9px;border-radius:2px;cursor:pointer}output{display:block;padding:5px 10px 10px;font-size:12px}iframe{width:100%;height:calc(100vh - 130px);border:0}</style>
<header><button id="mode">Bark cuts</button><button id="detail">Next cut / axe</button><button data-p="0.3">Reach back</button><button data-p="0.5">Lift bundle</button><button data-p="0.7">Stack logs</button><button id="angle">Other side</button></header><output>Loading…</output><iframe src="/?capture&nopad"></iframe>
<script type="module">
import {chopContact} from '/src/mechanics.js';
let lab,tree,mode=0,detail=0,progress=.5,side=1;const frame=document.querySelector('iframe'),output=document.querySelector('output');
const wait=setInterval(()=>{lab=frame.contentWindow.lab;if(!lab?.ready)return;clearInterval(wait);tree=lab.forest.trees.find(t=>t.hero);lab.game.update=()=>{};lab.game.hit=()=>{};lab.game.save=()=>{};lab.game.started=true;lab.game.before=()=>{lab.game.state.axe=mode===1?detail%5:0;lab.game.tools.equip(lab.game.state.axe);lab.game.swing=mode===1?{t:tree,age:.5,duration:1,contact:chopContact(tree,lab.player.feet,lab.player.visualY)}:null;lab.game.delivery=mode===2?{parts:[18],batch:0,progress}:null;};place();},100);
function place(){if(!lab?.ready)return;let x=tree.x,z=tree.z+tree.r+1.25;if(mode===2){x=lab.game.home.dropoff.x;z=lab.game.home.dropoff.z+.7;lab.game.state.carried=36;lab.game.state.wood=18;lab.game.renderHud();}lab.teleport(x,z,x,z-4);for(const id of ['intro','hud','controls','action','mouse-capture','target','home-marker'])frame.contentDocument.getElementById(id).hidden=true;const y=lab.heightAt(x,z);lab.view([x+side*3.5,y+1.9,z+.7],[x,y+1.18,z-(mode===2?.4:1)]);render();}
function render(){if(!lab?.ready)return;if(mode===0){const damage=[.18,.4,.65,.9][detail%4],c=chopContact(tree,lab.player.feet,lab.player.visualY);lab.forest.carveTree(tree,c,0,1,damage);output.textContent=`Bark damage ${Math.round(damage*100)}% · Cut depth ${(tree.cut.depth*100).toFixed(1)} cm`;}else if(mode===1)output.textContent=['Hand axe','Felling axe','Steel axe','Splitting axe','Forester’s axe'][detail%5];else output.textContent=`Unloading phase ${progress}`;for(let i=0;i<12;i++)lab.step(1/60);}
document.querySelector('#mode').onclick=e=>{mode=(mode+1)%3;detail=0;e.target.textContent=['Bark cuts','Axe models','Unloading'][mode];place();};document.querySelector('#detail').onclick=()=>{detail++;render();};for(const b of document.querySelectorAll('[data-p]'))b.onclick=()=>{progress=+b.dataset.p;render();};document.querySelector('#angle').onclick=()=>{side*=-1;place();};
</script>
