<!doctype html><html lang="en"><meta charset="utf-8"><title>Loggin’ woodland playtest</title>
<style>body{margin:0;background:#292e25;color:#eee0c2;font:13px system-ui}header{padding:7px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}button{background:#e6d7b8;color:#272c25;border:0;padding:6px 9px}output{font:12px monospace}iframe{display:block;border:0;width:100%;height:calc(100vh - 80px)}</style>
<header><button data-place="0">Orchard</button><button data-place="1">Riverwatch</button><button data-place="2">Pine Hollow</button><button id="supplies">Supply restored homes</button><button id="sign">Camp fingerpost</button><button id="cart">Visit cart</button><button id="round">Follow hauler</button><button id="walk">Walk forward</button><button id="action">Interact</button><button id="field">Field action</button><button id="clue">Next find</button><button id="trunk">Visit windthrow</button><button id="chop">Hold axe</button><button id="keeper">Visit keeper</button><button id="rack">Visit east rack</button><button id="bridge">Cross bridge</button><button id="toss">Pack logs</button><button id="dusk">Evening</button><button id="rain">Show rain</button><button id="still">Save cart still</button><output>Loading the wood…</output></header>
<iframe title="Playable forest" src="/?capture&amp;nopad&amp;woodlandReview"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('output');let lab,g;
const $=id=>document.getElementById(id),neutral=()=>({move:{x:0,y:0},look:{x:0,y:0},zoom:0,walk:false,device:'pad'});
const poll=setInterval(()=>{lab=frame.contentWindow.lab;if(!lab?.ready)return;clearInterval(poll);g=lab.game;g.started=true;lab.input.override=neutral;
 for(const id of ['intro','mouse-capture'])frame.contentDocument.getElementById(id).hidden=true;
 for(const id of ['hud','controls','action'])frame.contentDocument.getElementById(id).hidden=false;
 lab.step(1/60,2);report();},100);
function report(){const c=g.state.woodland.cart,p=lab.player.feet;out.textContent='Day '+g.state.day+' · Bag '+g.state.carried+' · Shared '+g.state.wood+' · Cart '+c.load+' / '+(c.hired?'hired':'no crew')+' · Route '+c.progress.toFixed(2)+' · '+(g.onTrail?'trail':'woods')+' · '+(g.target?.windthrow?'windthrow':'standing')+' · x '+p.x.toFixed(1)+' z '+p.z.toFixed(1);}
function visit(x,z,fx,fz){lab.view(null);lab.teleport(x,z,fx,fz);lab.step(.025,2);g.updatePrompt();report();}
function shot(eye,look){lab.view(eye,look);lab.step(.025,1);}
function key(k){lab.input.override=()=>({...neutral(),[k]:true});lab.step(.025,1);lab.input.override=neutral;g.updatePrompt();report();}
for(const b of document.querySelectorAll('[data-place]'))b.onclick=()=>{const h=g.exploration.sites[+b.dataset.place],p=h.dropoff;visit(p.x,p.z+1.1,p.x,p.z-1);};
$('supplies').onclick=()=>{Object.assign(g.state,{wood:400,hardwood:60,planks:80,shed:40,sawmill:40,axe:2,carried:18,carriedHardwood:3});for(const p of g.state.places)Object.assign(p,{found:true,wood:24,planks:8,trail:40});g.exploration.sync(g.state);g.field.sync();g.renderHud();g.shade.refresh();g.save();report();};
$('sign').onclick=()=>{
 const p=g.exploration.guide.position;g.state.hour=15.4;
 g.weatherOverride={rain:0,mist:0,overcast:.12,label:'Clear'};
 visit(p.x-1.8,p.z+1.3,p.x,p.z);
 shot([p.x+3.45,p.y+1.92,p.z+3.65],[p.x-.46,p.y+1.25,p.z]);g.updatePrompt();
};
$('cart').onclick=()=>{const p=g.cart.axle.position;visit(p.x+1.3,p.z+.45,p.x,p.z);};
$('round').onclick=()=>{const c=g.state.woodland.cart;for(let j=0;j<8;j++)g.cart.update(.4);const p=g.cart.axle.position,y=c.yaw,dx=Math.sin(y),dz=Math.cos(y);
 shot([p.x+dz*3.4+dx*2.7,p.y+1.85,p.z-dx*3.4+dz*2.7],[p.x+dx*.43,p.y+.90,p.z+dz*.43]);report();};
$('action').onclick=()=>key('interactPressed');$('field').onclick=()=>key('fieldPressed');
$('walk').onclick=()=>{lab.input.override=()=>({...neutral(),move:{x:0,y:1}});lab.step(.05,22);lab.input.override=neutral;lab.step(.04,3);report();};
$('trunk').onclick=()=>{const t=g.field.windthrows()[0];if(!t){out.textContent='All five windthrows cleared.';return;}visit(t.x+.72,t.z+.16,t.x,t.z);};
$('keeper').onclick=()=>{const t=g.forest.trees.find(t=>g.field.canReserve(t,g.state)&&t.type===1);if(!t){out.textContent='No eligible birch near a home.';return;}visit(t.x,t.z+t.r+.6,t.x,t.z);};
$('chop').onclick=()=>{g.held=true;lab.step(.05,27);g.held=false;g.updatePrompt();report();};
$('clue').onclick=()=>{const f=g.field.finds.find(f=>!g.state.woodland.finds.includes(f.key))||g.field.finds[0],p=f.g.position;visit(p.x,p.z+1.1,p.x,p.z);};
$('rack').onclick=()=>{const p=g.field.racks[0].g.position;visit(p.x,p.z+.95,p.x,p.z);};
$('bridge').onclick=()=>{const rack=g.field.racks[0].g.position,x=rack.x-16.2,z=rack.z+1;visit(x,z,x+2,z);
 lab.input.override=()=>({...neutral(),move:{x:0,y:1}});lab.step(.05,64);lab.input.override=neutral;lab.step(.04,4);report();};
$('toss').onclick=()=>{g.state.carried=40;g.state.carriedHardwood=7;g.renderHud();report();};
$('dusk').onclick=()=>{g.state.hour=17.65;lab.step(.02,1);report();};
$('rain').onclick=()=>{g.weatherOverride={rain:.8,mist:.2,overcast:.78,label:'Rain'};lab.step(.03,3);report();};
$('still').onclick=()=>{lab.step(.02,1);lab.renderer.domElement.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='trail-crew.webp';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);},'image/webp',.86);};
</script></html>
